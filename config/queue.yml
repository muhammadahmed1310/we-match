default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Include solid_queue_recurring or scheduled jobs never leave that queue.
    - queues: "solid_queue_recurring,cycles,mailers,default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
