default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # "*" includes solid_queue_recurring; without it scheduled jobs never run.
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
