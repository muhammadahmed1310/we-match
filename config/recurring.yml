# The biweekly rhythm. Times are UTC (see config.time_zone).
#
# Cycles open on Monday and are only actually created if the group is due, so this
# task can run every Monday while each group still gets a cycle every fortnight.
shared: &shared
  open_biweekly_cycles:
    class: OpenBiweeklyCyclesJob
    queue: cycles
    schedule: every monday at 9am

  send_response_reminders:
    class: SendResponseRemindersJob
    queue: mailers
    schedule: every wednesday at 9am

  send_match_feedback_requests:
    class: SendMatchFeedbackRequestsJob
    queue: mailers
    schedule: every day at 10am

  close_due_cycles:
    class: CloseDueCyclesJob
    queue: cycles
    schedule: every thursday at 5:05pm

  run_due_matching:
    class: RunDueMatchingJob
    queue: cycles
    schedule: every friday at 9am

development:
  <<: *shared

production:
  <<: *shared

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every day at 3am
